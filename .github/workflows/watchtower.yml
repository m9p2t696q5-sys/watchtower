name: Watchtower Daily

on:
  schedule:
    # 每天 UTC 00:30 = 北京时间 08:30
    - cron: '30 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watchtower
  cancel-in-progress: false

jobs:
  watchtower:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watchtower
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python watchtower/main.py

      - name: Commit report
        run: |
          git config user.name "watchtower-bot"
          git config user.email "watchtower-bot@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "watchtower: $(TZ=Asia/Shanghai date +%F) daily report"
            git push
          fi
