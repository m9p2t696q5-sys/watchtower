name: Watchtower Weekly

on:
  schedule:
    # 每周日 UTC 13:00 = 北京时间 21:00（晚于周日晚报，保证数据完整）
    - cron: '0 13 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watchtower-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        run: python watchtower/weekly.py

      - name: Commit report
        run: |
          git config user.name "watchtower-bot"
          git config user.email "watchtower-bot@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "watchtower: $(TZ=Asia/Shanghai date +%F) weekly report"
            git push
          fi
